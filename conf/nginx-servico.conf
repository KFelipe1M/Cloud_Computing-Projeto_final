server {
    listen: 80;
    return 301 https://$host:8444$request_url;
 }     

        server  {
        listen 443 ssl;
        server_name service.lab;
        ssl_certificate     /etc/ssl/certs/servico.crt;
        ssl_certificate_key /etc/ssl/certs/servico.crt;
        ssl_protocols TLSv1.2 TLsv.3;
        client_max_body_size 512M;
        
        location / {

            proxy_pass https://10.10.10.11;
            proxy_set_heder Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme
   }
}
        
