description: Aplicacao_nextcloud
config:
  limits.memory: 1GiB
  cloud-init.user-data: | 
    #cloud-config
    package_update: true
    packages:
      - libapache2-mod-php
      - php
      - php-mysql
      - php-gd
      - php-curl
      - php-mbstring
      - php-xml
      - php-zip
      - php-intl
      - php-bcmath
      - php-gmp
      - bzip2
      - curl
      - sudo
